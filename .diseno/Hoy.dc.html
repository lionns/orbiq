<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: #0f766e; } a:hover { color: #0c5d57; }
    /* Valores tomados literalmente de src/ui/ y globals.css: rounded-card 8px, rounded-button 12px,
       min-h-12 48px, min-h-14 56px, p-3 12px, gap-3 12px, text-total 40px. */
    .cel { display: flex; flex-direction: column; justify-content: space-between;
           background: #e9e7e4; border: 1px solid #7c756f; border-radius: 8px; padding: 12px;
           min-height: 96px; text-align: left; font-size: 16px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; color: #1c1917; font-size: 16px;">

  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; gap: 8px;">
      <div style="flex-grow: 1; min-height: 48px; border: 1px solid #7c756f; background: #e9e7e4; border-radius: 12px; padding: 0 16px; display: flex; align-items: center;">
        <span style="color: #57534e;">Nombre o código</span>
      </div>
      <div style="min-height: 48px; border: 1px solid #7c756f; background: #e9e7e4; border-radius: 12px; padding: 0 16px; display: flex; align-items: center; font-weight: 500;">Cámara</div>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 16px 16px 0; overflow: hidden;">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">

      <div class="cel">
        <span style="font-weight: 500; line-height: 1.4;">Arroz Diana 500 g</span>
        <span>
          <span style="display: block; font-variant-numeric: tabular-nums;">$&nbsp;3.500</span>
          <span style="display: block; font-variant-numeric: tabular-nums;">12</span>
        </span>
      </div>

      <div class="cel">
        <span style="font-weight: 500; line-height: 1.4;">Panela redonda</span>
        <span>
          <span style="display: block; font-variant-numeric: tabular-nums;">$&nbsp;2.800</span>
          <span style="display: block; font-variant-numeric: tabular-nums;">31</span>
        </span>
      </div>

      <div class="cel">
        <span style="font-weight: 500; line-height: 1.4;">Leche Alquería 1 L</span>
        <span>
          <span style="display: block; font-variant-numeric: tabular-nums;">$&nbsp;4.200</span>
          <span style="display: block; font-variant-numeric: tabular-nums;">3</span>
        </span>
      </div>

      <div class="cel">
        <span style="font-weight: 500; line-height: 1.4;">Aceite Premier 500 ml</span>
        <span>
          <span style="display: block; font-variant-numeric: tabular-nums;">$&nbsp;9.000</span>
          <span style="display: block; font-variant-numeric: tabular-nums;">8</span>
        </span>
      </div>

      <div class="cel">
        <span style="font-weight: 500; line-height: 1.4;">Café Sello Rojo 250 g</span>
        <span>
          <span style="display: block; font-variant-numeric: tabular-nums;">$&nbsp;11.000</span>
          <span style="display: block; font-variant-numeric: tabular-nums;">6</span>
        </span>
      </div>

      <div class="cel">
        <span style="font-weight: 500; line-height: 1.4;">Huevos AA · unidad</span>
        <span>
          <span style="display: block; font-variant-numeric: tabular-nums;">$&nbsp;800</span>
          <span style="display: block; font-variant-numeric: tabular-nums;">0</span>
        </span>
      </div>

    </div>
  </div>

  <div style="border-top: 1px solid #d6d3d1; background: #ffffff;">
    <div style="padding: 0 16px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0;">
        <span style="flex-grow: 1; min-width: 0;">
          <span style="display: block;">Panela redonda</span>
          <span style="display: block; color: #57534e; font-variant-numeric: tabular-nums;">$&nbsp;5.600</span>
        </span>
        <span style="display: flex; align-items: center; gap: 4px;">
          <span style="min-height: 48px; min-width: 48px; border: 1px solid #7c756f; background: #e9e7e4; border-radius: 12px; display: grid; place-items: center;">−</span>
          <span style="min-width: 32px; text-align: center; font-variant-numeric: tabular-nums;">2</span>
          <span style="min-height: 48px; min-width: 48px; border: 1px solid #7c756f; background: #e9e7e4; border-radius: 12px; display: grid; place-items: center;">+</span>
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0;">
        <span style="flex-grow: 1; min-width: 0;">
          <span style="display: block;">Arroz Diana 500 g</span>
          <span style="display: block; color: #57534e; font-variant-numeric: tabular-nums;">$&nbsp;3.500</span>
        </span>
        <span style="display: flex; align-items: center; gap: 4px;">
          <span style="min-height: 48px; min-width: 48px; border: 1px solid #7c756f; background: #e9e7e4; border-radius: 12px; display: grid; place-items: center;">−</span>
          <span style="min-width: 32px; text-align: center; font-variant-numeric: tabular-nums;">1</span>
          <span style="min-height: 48px; min-width: 48px; border: 1px solid #7c756f; background: #e9e7e4; border-radius: 12px; display: grid; place-items: center;">+</span>
        </span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; border-top: 1px solid #d6d3d1; padding: 16px;">
      <span style="flex-grow: 1;">
        <span style="display: block; color: #57534e;">Total · 3 artículos</span>
        <span style="display: block; font-weight: 600; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums;">$&nbsp;9.100</span>
      </span>
      <span style="min-height: 56px; padding: 0 24px; border-radius: 12px; background: #0f766e; color: #ffffff; font-weight: 500; display: inline-flex; align-items: center;">Confirmar</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
