<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { llegaron: 24 };
}
renderVals() {
var self = this;
var n = this.state.llegaron;
return {
llegaron: n,
menos: function () { self.setState({ llegaron: Math.max(0, n - 1) }); },
mas: function () { self.setState({ llegaron: n + 1 }); },
resumen: 'Se suman a las 4 que ya hay: quedan ' + (4 + n) + ' en total.'
};
}
}
</script>
