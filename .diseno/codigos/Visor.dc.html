<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Visor de la cámara</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;display=swap">
<style>
body{margin:0;font-family:"Geist",system-ui,sans-serif;color:#12152a}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 360px; height: 844px; background: #0d0f1c; color: #eef0fb; font-family: 'Geist',system-ui,sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; font-size: 16px; line-height: 1.5;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0;">
    <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em;">Apunta al código</span>
    <a href="Vender.dc.html" aria-label="Cerrar la cámara" style="display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px; border-radius: 9999px; background: rgba(255,255,255,0.14); font-weight: 600; color: #ffffff;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Cerrar</a>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 0 16px;">
    <div onClick="{{tocar}}" style="position: relative; width: 328px; height: 420px; border-radius: 24px; overflow: hidden; background: radial-gradient(circle at 50% 45%, #3a3f58 0%, #1c2038 55%, #111427 100%);">
      <span style="position: absolute; top: 12px; left: 12px; font-size: 14px; color: #a1a7c4;">Imagen de la cámara</span>
      <div style="position: absolute; left: 50%; top: 50%; width: 150px; height: 96px; transform: translate(-50%, -50%); border-radius: 8px; background: #f4f4f0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <div style="width: 118px; height: 58px; background: repeating-linear-gradient(90deg, #111 0 2px, transparent 2px 4px, #111 4px 7px, transparent 7px 9px, #111 9px 10px, transparent 10px 13px);"></div>
        <span class="num" style="font-size: 11px; color: #111; letter-spacing: 0.08em;">7702511004432</span>
      </div>
      <div style="position: absolute; left: 34px; right: 34px; top: 120px; bottom: 120px;">
        <span style="position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-left: 4px solid #8397ff; border-top: 4px solid #8397ff; border-radius: 12px 0 0 0;"></span>
        <span style="position: absolute; right: 0; top: 0; width: 36px; height: 36px; border-right: 4px solid #8397ff; border-top: 4px solid #8397ff; border-radius: 0 12px 0 0;"></span>
        <span style="position: absolute; left: 0; bottom: 0; width: 36px; height: 36px; border-left: 4px solid #8397ff; border-bottom: 4px solid #8397ff; border-radius: 0 0 0 12px;"></span>
        <span style="position: absolute; right: 0; bottom: 0; width: 36px; height: 36px; border-right: 4px solid #8397ff; border-bottom: 4px solid #8397ff; border-radius: 0 0 12px 0;"></span>
        <span style="position: absolute; left: 8px; right: 8px; top: 50%; height: 2px; background: #8397ff; box-shadow: 0 0 12px #8397ff;"></span>
      </div>
      <sc-if value="{{hayToque}}" hint-placeholder-val="{{ false }}">
        <span aria-hidden="true" style="position: absolute; left: {{toqueX}}px; top: {{toqueY}}px; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 9999px; border: 3px solid #ffffff; box-shadow: 0 0 0 2px rgba(0,0,0,0.35); pointer-events: none;"></span>
      </sc-if>
      <button type="button" aria-pressed="{{zoom}}" onClick="{{alternarZoom}}" style="position: absolute; right: 12px; bottom: 12px; min-width: 64px; min-height: 48px; padding: 0 14px; border-radius: 9999px; border: 2px solid {{bordeZoom}}; background: {{fondoZoom}}; color: {{textoZoom}}; font: inherit; font-size: 17px; font-weight: 700;">{{textoBoton}}</button>
    </div>
  </div>

  <div style="padding: 0 16px 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center;">
    <p style="margin: 0; font-size: 17px; font-weight: 600;">Se lee solo. No hace falta tocar nada.</p>
    <p style="margin: 0; font-size: 17px; font-weight: 600;">¿Se ve borroso? Aleja un poco el teléfono.</p>
    <p style="margin: 0; color: #a1a7c4;">Si el código se ve muy pequeño, toca 2×.</p>
    <a href="Vender.dc.html" style="align-self: stretch; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 16px; border: 1px solid #7d83a3; color: #eef0fb; font-size: 17px; font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eef0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01"/><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/><path d="M7 16h10"/></svg>Escribir el código</a>
    <span class="num" style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 9999px; background: rgba(255,255,255,0.10); color: #eef0fb; font-weight: 600;">La venta sigue: 2 productos · $ 7.000</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { zoom: false, toque: null };
}
renderVals() {
var self = this;
var z = this.state.zoom;
return {
zoom: z,
alternarZoom: function (e) { e.stopPropagation(); self.setState({ zoom: !z }); },
tocar: function (e) {
var r = e.currentTarget.getBoundingClientRect();
var escala = r.width / 328;
self.setState({ toque: { x: (e.clientX - r.left) / escala, y: (e.clientY - r.top) / escala } });
clearTimeout(self.temporizador);
self.temporizador = setTimeout(function () { self.setState({ toque: null }); }, 900);
},
hayToque: this.state.toque !== null,
toqueX: this.state.toque ? Math.round(this.state.toque.x) : 0,
toqueY: this.state.toque ? Math.round(this.state.toque.y) : 0,
textoBoton: z ? '1×' : '2×',
fondoZoom: z ? '#8397ff' : 'rgba(13,15,28,0.7)',
textoZoom: z ? '#0d0f1c' : '#eef0fb',
bordeZoom: z ? '#8397ff' : '#7d83a3'
};
}
}
</script>
</body>
</html>
